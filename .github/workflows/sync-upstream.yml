name: Sync upstream pstack

# Weekly: mirror pstack from cursor/plugins, rebuild every agent's tree, and release a new upstream version.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: cursor/plugins branch or tag to sync from
        default: main

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # GitHub turns off a scheduled workflow after 60 days without repository activity. Re-enabling resets that clock.
      - name: Keep the schedule alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable"

      - name: Record the synced upstream commit
        id: before
        run: |
          echo "commit=$(jq -r .commit upstream/UPSTREAM.json 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "since=$(jq -r .committedAt upstream/UPSTREAM.json 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      # Fails when upstream changes the generator in a way scripts/build.mjs does not expect, or uses a Cursor
      # name an adapter has no row for. Fix the adapter or build.mjs, then rerun.
      - name: Sync and rebuild
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: node scripts/sync.mjs "$REF"

      - name: Commit, tag, and release
        env:
          OLD: ${{ steps.before.outputs.commit }}
          SINCE: ${{ steps.before.outputs.since }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "pstack is already in sync with upstream."
            exit 0
          fi
          version=$(jq -r .version upstream/UPSTREAM.json)
          new=$(jq -r .commit upstream/UPSTREAM.json)

          {
            echo "Synced from cursor/plugins@${new:0:7}."
            echo
            echo "Upstream pstack commits:"
            gh api -X GET "repos/cursor/plugins/commits" -f path=pstack -f sha="$new" -f per_page=100 ${SINCE:+-f since="$SINCE"} \
              --jq '.[] | "\(.sha) \(.commit.message | split("\n")[0])"' |
              awk -v old="$OLD" '$1 == old { exit } { sha = substr($1, 1, 7); $1 = ""; print "- " sha $0 }'
            echo
            echo "Changed skills, agents, and scripts:"
            git diff --cached --name-status -- upstream/pstack/skills upstream/pstack/agents |
              sed 's|upstream/pstack/||g; s/^/- /' | head -100
          } > notes.md
          cat notes.md

          { echo "chore(sync): pstack $version from cursor/plugins@${new:0:7}"; echo; cat notes.md; } |
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -F -
          git push

          tag="v$version"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git tag "$tag"
            git push origin "$tag"
            gh release create "$tag" --title "pstack $version" --notes-file notes.md
          fi

      - name: Open an issue on failure
        if: failure()
        run: |
          title="Weekly pstack sync failed"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "The sync from cursor/plugins failed: $url. The log names what changed upstream."
          fi
